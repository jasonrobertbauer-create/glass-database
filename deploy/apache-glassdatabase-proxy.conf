# Shared proxy config for glassdatabase.org.
# Included by BOTH the :80 vhost and certbot's :443 vhost, so the two can never
# drift apart. Add or change a route HERE, then: sudo systemctl reload apache2
# (Domain-agnostic on purpose — no ServerName here.)

ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

# --- Compression: shrink text/JSON/HTML on the wire (big win for API + pages) --
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
        application/javascript application/json application/xml \
        text/turtle text/calendar image/svg+xml application/manifest+json
</IfModule>

# --- Static caching: let browsers cache the landing page assets & capture apps -
<IfModule mod_headers.c>
    # Security headers for every response (static pages, API, Streamlit).
    # The CSP allows inline scripts (these pages and Streamlit), Google fonts,
    # the studios map (Leaflet + CARTO), the 3D photo viewer, Google sign-in,
    # and the fingerprint camera (jsDelivr, Hugging Face, a blob worker).
    # Keep this value identical to central.security_headers.CSP.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(self)"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' blob: data: wss: ws: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob: https://accounts.google.com; media-src 'self' blob: data:; manifest-src 'self'"
    # Only on a real HTTPS connection. Browsers ignore HSTS sent over plain HTTP.
    Header always set Strict-Transport-Security "max-age=15552000" "expr=%{HTTPS} == 'on'"

    # Fonts, icons and images can sit in the browser for a day.
    <LocationMatch "\.(woff2?|ttf|ico|png|jpg|jpeg|webp|svg|webmanifest|pdf)$">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>
    # Stylesheets and scripts change with every deploy and the HTML that uses them
    # is served no-cache, so make browsers re-check these quickly (they're small).
    # A day-long cache here left people with an unstyled nav after a release.
    <LocationMatch "\.(css|js|mjs)$">
        Header set Cache-Control "public, max-age=300, must-revalidate"
    </LocationMatch>
    # never cache the app streams / html shells
    <LocationMatch "_stcore|\.html$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
</IfModule>

# --- Pretty URLs: /games -> /games.html (people type and share them without .html) --
RedirectMatch 301 ^/(games|events|register|graph|studios|shop|shop-costs|splat)/?$ /$1.html

# --- Public read-only API -> uvicorn :8000 --------------------------------
ProxyPass        /api/ http://127.0.0.1:8000/
ProxyPassReverse /api/ http://127.0.0.1:8000/

# --- Admin (write) -> Streamlit :8501, basic-auth protected ---------------
<Location /admin/>
    AuthType Basic
    AuthName "Glass Database admin"
    AuthUserFile /opt/glassdatabase/.htpasswd
    Require valid-user
</Location>
ProxyPass        /admin/_stcore/stream ws://127.0.0.1:8501/admin/_stcore/stream
ProxyPassReverse /admin/_stcore/stream ws://127.0.0.1:8501/admin/_stcore/stream
ProxyPass        /admin/ http://127.0.0.1:8501/admin/
ProxyPassReverse /admin/ http://127.0.0.1:8501/admin/

# --- Public data explorer -> Streamlit :8502 -----------------------------
ProxyPass        /explore/_stcore/stream ws://127.0.0.1:8502/explore/_stcore/stream
ProxyPassReverse /explore/_stcore/stream ws://127.0.0.1:8502/explore/_stcore/stream
ProxyPass        /explore/ http://127.0.0.1:8502/explore/
ProxyPassReverse /explore/ http://127.0.0.1:8502/explore/

# --- Glowtbook -> Streamlit :8503 ----------------------------------------
ProxyPass        /glowtbook/_stcore/stream ws://127.0.0.1:8503/glowtbook/_stcore/stream
ProxyPassReverse /glowtbook/_stcore/stream ws://127.0.0.1:8503/glowtbook/_stcore/stream
ProxyPass        /glowtbook/ http://127.0.0.1:8503/glowtbook/
ProxyPassReverse /glowtbook/ http://127.0.0.1:8503/glowtbook/
