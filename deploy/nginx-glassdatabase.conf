# Glass Database — nginx reverse proxy.
# HTTP only here; `certbot --nginx` adds the TLS server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name glassdatabase.org www.glassdatabase.org;

    # Same headers as deploy/apache-glassdatabase-proxy.conf and
    # central.security_headers. CSP allows Streamlit, the fingerprint camera
    # (jsDelivr + Hugging Face), the map, fonts and Google sign-in.
    # When certbot adds the TLS server, repeat these lines there. HSTS is
    # ignored by browsers on this plain-HTTP server; it belongs on the TLS one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' blob: data: wss: ws: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob: https://accounts.google.com; media-src 'self' blob: data:; manifest-src 'self'" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # --- Public read-only API -> uvicorn on 127.0.0.1:8000 -----------------
    # Trailing slash on proxy_pass strips the /api prefix; the app's ROOT_PATH
    # (=/api, set in .env) keeps the Swagger docs and links correct.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin (write access) -> Streamlit, protected by basic auth --------
    location ^~ /admin/ {
        auth_basic "Glass Database admin";
        auth_basic_user_file /opt/glassdatabase/.htpasswd;

        proxy_pass http://127.0.0.1:8501/admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # websocket for Streamlit
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Root -> the interactive API docs for now.
    # (Point this at the public explorer later if you deploy it.)
    location = / {
        return 302 /api/docs;
    }

    # --- Public data explorer -> Streamlit :8502 --------------------------
    location ^~ /explore/ {
        proxy_pass http://127.0.0.1:8502/explore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # --- Glowtbook (demo) -> Streamlit :8503 ------------------------------
    location ^~ /glowtbook/ {
        proxy_pass http://127.0.0.1:8503/glowtbook/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    client_max_body_size 25m;
}
